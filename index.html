<style>
/* Layout: 地形図の余白に置いた装備帳。上に山行条件と集計、下にカテゴリ別の2段組チェックリスト */
:root {
  --bg: #edf0ea;
  --surface: #f8faf6;
  --ink: #1c2b2a;
  --muted: #5b6b66;
  --line: #cbd3cb;
  --accent: #2e6a57;
  --accent-soft: #d6e6dd;
  --must: #9a5a12;
  --must-soft: #f1e2cc;
  --contour: rgba(154, 90, 18, .13);
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Consolas", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111917; --surface: #19231f; --ink: #e3eae5; --muted: #93a39d; --line: #2d3b36;
    --accent: #72b99e; --accent-soft: #20372e; --must: #dba455; --must-soft: #3a2c17;
    --contour: rgba(219, 164, 85, .10);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111917; --surface: #19231f; --ink: #e3eae5; --muted: #93a39d; --line: #2d3b36;
  --accent: #72b99e; --accent-soft: #20372e; --must: #dba455; --must-soft: #3a2c17;
  --contour: rgba(219, 164, 85, .10);
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; }

header.top {
  position: relative; padding-block: 36px 20px; overflow: hidden;
}
header.top::before {
  content: ""; position: absolute; inset: -40% -10% auto auto; width: 560px; height: 560px; max-width: 120%;
  background: repeating-radial-gradient(ellipse at 62% 48%, transparent 0 17px, var(--contour) 17px 18px);
  pointer-events: none; z-index: 0;
}
header.top > * { position: relative; z-index: 1; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(36px, 7vw, 56px); line-height: 1.1; margin: 4px 0 8px; letter-spacing: .02em; }
.lede { color: var(--muted); max-width: 38em; margin: 0; text-wrap: pretty; }

.controls { display: grid; gap: 14px; margin-top: 22px; }
.ctl-label { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.seg button {
  font: inherit; font-weight: 500; border: 0; background: transparent; color: var(--ink);
  padding: 9px 18px; cursor: pointer; border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.chip[aria-pressed="true"]::before { content: "✓ "; }
button:focus-visible, input:focus-visible, select:focus-visible, label.item:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.summary {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 12px;
}
.stat { display: flex; align-items: baseline; gap: 8px; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .08em; font-weight: 700; }
.stat .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px; }
.stat .v small { font-size: 13px; color: var(--muted); font-weight: 400; }
.meter { flex: 1 1 160px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 120px; }
.meter i { display: block; height: 100%; background: var(--must); width: 0; transition: width .3s; }
.meter.done i { background: var(--accent); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: var(--r); padding: 6px 12px; cursor: pointer;
}
.btn.warn { border-color: var(--must); color: var(--must); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.board { columns: 2 440px; column-gap: 28px; margin-top: 24px; }
section.cat { break-inside: avoid; margin-bottom: 28px; }
.cat h2 {
  font-size: 16px; font-weight: 700; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 2px solid var(--ink); padding-bottom: 4px; text-wrap: balance;
}
.cat h2 .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-weight: 400; }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { border-bottom: 1px dashed var(--line); }
label.item {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 12px; align-items: start;
  padding: 9px 2px; cursor: pointer; border-radius: 4px;
}
label.item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box {
  width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 4px; margin-top: 2px;
  display: grid; place-items: center; background: var(--surface);
}
.box svg { width: 13px; height: 13px; opacity: 0; }
label.item input:checked + .box { background: var(--accent); border-color: var(--accent); }
label.item input:checked + .box svg { opacity: 1; }
.name { font-weight: 500; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
label.item input:checked ~ .body .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.note { grid-column: 2 / 4; font-size: 13px; color: var(--muted); line-height: 1.5; }
.g { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; border-radius: 3px; padding: 0 6px; line-height: 18px; }
.tag.must { background: var(--must-soft); color: var(--must); }
.tag.my { background: var(--accent-soft); color: var(--accent); }
.del { font: inherit; font-size: 12px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; text-decoration: underline; }

.add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.add input, .add select {
  font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: var(--r); padding: 7px 10px;
}
.add input { flex: 1 1 180px; min-width: 0; }
.empty { color: var(--muted); font-size: 14px; padding: 24px 0; }

footer { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
footer b { color: var(--ink); }
@media (max-width: 520px) {
  .seg button { padding: 8px 12px; }
  .summary { gap: 8px 16px; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">登山装備チェックリスト</div>
    <h1>山支度帳</h1>
    <p class="lede">山行タイプと条件を選ぶと、必要な装備だけが並びます。チェック状態はこの端末に保存されます。重量は一般的な製品の目安で、車に置いておくもの（車中泊・下山後）は含みません。</p>
    <div class="controls">
      <div>
        <div class="ctl-label">山行タイプ</div>
        <div class="seg" id="type-seg" role="group" aria-label="山行タイプ"></div>
      </div>
      <div>
        <div class="ctl-label">条件（複数可）</div>
        <div class="chips" id="cond-chips" role="group" aria-label="条件"></div>
      </div>
    </div>
  </header>

  <div class="summary" aria-live="polite">
    <div class="stat"><span class="k">必携</span><span class="v" id="s-must">0<small>/0</small></span></div>
    <div class="meter" id="s-meter"><i></i></div>
    <div class="stat"><span class="k">全体</span><span class="v" id="s-all">0<small>/0</small></span></div>
    <div class="stat"><span class="k">重量目安</span><span class="v" id="s-kg">0.0<small> kg</small></span></div>
    <div class="tools">
      <button class="btn" id="btn-unchecked" type="button" aria-pressed="false">未チェックのみ</button>
      <button class="btn" id="btn-reset" type="button">チェックを外す</button>
    </div>
  </div>

  <main class="board" id="board"></main>

  <section class="cat" style="max-width: 520px">
    <h2>マイアイテムを追加</h2>
    <form class="add" id="add-form">
      <input id="add-name" type="text" placeholder="例：カメラ、行動食の追加分" aria-label="アイテム名" maxlength="40">
      <select id="add-cat" aria-label="カテゴリ"></select>
      <button class="btn" type="submit">追加</button>
    </form>
  </section>

  <footer>
    <div><b>出発前に：</b>登山計画書を家族と登山口（またはコンパス等のオンライン）に提出し、下山予定時刻を共有しておきましょう。</div>
    <div><b>気温の目安：</b>標高が100m上がるごとに約0.6℃下がります。麓が20℃なら標高3,000mの稜線は約2℃です（麓0m換算）。風速1m/sごとに体感温度はさらに約1℃下がります。</div>
  </footer>
</div>

  { id: "after-drink", cat: "after", name: "帰りの飲み物", note: "クーラーボックスに入れておくと下山後にうれしい", g: 0, req: "rec", t: ALL },

const KEY = "yamajitaku-v1";
let state = { type: "day", conds: [], checked: {}, custom: [], onlyUnchecked: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = Object.assign(state, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const level = it => typeof it.req === "string" ? it.req : it.req[state.type];
const visible = () => ITEMS.filter(it => it.t.includes(state.type) && (!it.conds || it.conds.some(c => state.conds.includes(c))))
  .concat(state.custom.map(c => ({ ...c, req: "my", t: ALL, g: 0 })));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CHECK = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.5l3.2 3L12 3.5" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderControls() {
  document.getElementById("type-seg").innerHTML = TYPES.map(t =>
    `<button type="button" id="type-${t.id}" data-type="${t.id}" aria-pressed="${state.type === t.id}">${t.label}</button>`).join("");
  document.getElementById("cond-chips").innerHTML = CONDS.map(c =>
    `<button type="button" class="chip" id="cond-${c.id}" data-cond="${c.id}" aria-pressed="${state.conds.includes(c.id)}">${c.label}</button>`).join("");
  document.getElementById("btn-unchecked").setAttribute("aria-pressed", state.onlyUnchecked);
}

function renderBoard() {
  const vis = visible();
  const html = CATS.map(cat => {
    const all = vis.filter(it => it.cat === cat.id);
    if (!all.length) return "";
    const done = all.filter(it => state.checked[it.id]).length;
    const shown = state.onlyUnchecked ? all.filter(it => !state.checked[it.id]) : all;
    if (!shown.length) return "";
    shown.sort((a, b) => (level(a) === "must" ? 0 : 1) - (level(b) === "must" ? 0 : 1));
    return `<section class="cat"><h2>${cat.label}<span class="n">${done}/${all.length}</span></h2><ul class="items">` +
      shown.map(it => {
        const lv = level(it);
        const tag = lv === "must" ? '<span class="tag must">必携</span>' : lv === "my" ? '<span class="tag my">マイ</span>' : "";
        const del = lv === "my" ? `<button type="button" class="del" data-del="${it.id}">削除</button>` : "";
        return `<li><label class="item"><input type="checkbox" id="chk-${it.id}" data-id="${it.id}" ${state.checked[it.id] ? "checked" : ""}>` +
          `<span class="box">${CHECK}</span><span class="body"><span class="name">${esc(it.name)}${tag}${del}</span></span>` +
          `<span class="g">${it.g ? it.g.toLocaleString() + " g" : ""}</span>` +
          (it.note ? `<span class="note">${esc(it.note)}</span>` : "") + `</label></li>`;
      }).join("") + `</ul></section>`;
  }).join("");
  document.getElementById("board").innerHTML = html || '<p class="empty">すべてチェック済みです。気をつけて行ってらっしゃい。</p>';
  renderSummary(vis);
}

function renderSummary(vis) {
  const must = vis.filter(it => level(it) === "must");
  const mustDone = must.filter(it => state.checked[it.id]).length;
  const allDone = vis.filter(it => state.checked[it.id]).length;
  const kg = vis.reduce((s, it) => s + it.g, 0) / 1000;
  document.getElementById("s-must").innerHTML = `${mustDone}<small>/${must.length}</small>`;
  document.getElementById("s-all").innerHTML = `${allDone}<small>/${vis.length}</small>`;
  document.getElementById("s-kg").innerHTML = `${kg.toFixed(1)}<small> kg（着用含む）</small>`;
  const m = document.getElementById("s-meter");
  m.querySelector("i").style.width = must.length ? (mustDone / must.length * 100) + "%" : "0";
  m.classList.toggle("done", must.length > 0 && mustDone === must.length);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-type]"), c = e.target.closest("[data-cond]"), d = e.target.closest("[data-del]");
  if (t) { state.type = t.dataset.type; }
  else if (c) { const id = c.dataset.cond; state.conds = state.conds.includes(id) ? state.conds.filter(x => x !== id) : [...state.conds, id]; }
  else if (d) { e.preventDefault(); state.custom = state.custom.filter(x => x.id !== d.dataset.del); delete state.checked[d.dataset.del]; }
  else return;
  save(); renderControls(); renderBoard();
});
document.getElementById("board").addEventListener("change", e => {
  const id = e.target.dataset.id; if (!id) return;
  if (e.target.checked) state.checked[id] = true; else delete state.checked[id];
  save();
  if (state.onlyUnchecked) setTimeout(renderBoard, 250); else renderBoard();
});
document.getElementById("btn-unchecked").addEventListener("click", () => {
  state.onlyUnchecked = !state.onlyUnchecked; save(); renderControls(); renderBoard();
});
const resetBtn = document.getElementById("btn-reset");
let resetTimer;
resetBtn.addEventListener("click", () => {
  if (!resetBtn.classList.contains("warn")) {
    resetBtn.classList.add("warn"); resetBtn.textContent = "もう一度押すと全解除";
    resetTimer = setTimeout(() => { resetBtn.classList.remove("warn"); resetBtn.textContent = "チェックを外す"; }, 3000);
    return;
  }
  clearTimeout(resetTimer); state.checked = {}; save();
  resetBtn.classList.remove("warn"); resetBtn.textContent = "チェックを外す"; renderBoard();
});
const addCat = document.getElementById("add-cat");
addCat.innerHTML = CATS.filter(c => c.id !== "cond").map(c => `<option value="${c.id}"${c.id === "my" ? " selected" : ""}>${c.label}</option>`).join("");
document.getElementById("add-form").addEventListener("submit", e => {
  e.preventDefault();
  const inp = document.getElementById("add-name"), name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  state.custom.push({ id: "my-" + Date.now(), cat: addCat.value, name });
  inp.value = ""; save(); renderBoard();
});

renderControls(); renderBoard();

if ("serviceWorker" in navigator && location.protocol === "https:" && !location.hostname.endsWith("claude.ai")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
